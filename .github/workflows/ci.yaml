name: Validate
on: [push, pull_request]
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install filesystem test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run setup
      - run: npm install -g @openai/codex@0.160.0
      - run: docker compose -f compose.yaml -f compose.dev.yaml up -d database
      - name: Resolve the fake agent provider from the runner and workspaces
        run: |
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          printf '%s host.docker.internal\n' "$gateway" | sudo tee -a /etc/hosts
      - run: npm run check
      - run: npm run format:check
      - run: docker build -f docker/workspace.Dockerfile -t repellet/workspace-base:0.7.1 .
      - run: npm run test:docker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose build app worker
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --workspaces=false
        working-directory: apps/api/starters/react-vite/1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.runner }}
          path: |
            test-results/
            playwright-report/
